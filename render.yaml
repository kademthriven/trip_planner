services:
  - type: web
    name: rove-graph-trip-planner
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USERNAME
        value: cognodb
      - key: NEO4J_PASSWORD
        sync: false
      - key: DEMO_MODE
        value: false
